# Baut die PWA und stellt sie über GitHub Pages bereit.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
# Läuft bei jedem Push auf den Haupt-Branch und manuell über „Run workflow“.
name: Deploy PWA

on:
  push:
    # Branch-Namen sind in Actions groß/klein-sensitiv; das Repo nutzt „Main“.
    branches: [main, Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Adresse des Servers (Settings → Secrets and variables → Actions → Variables → API_URL).
      # Leer = Spielstand nur auf dem Gerät.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
